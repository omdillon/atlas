; PlatformIO Project Configuration File
;
; Standalone build for the hand-teleoperation firmware. Board: ESP32-S3-DevKitC-1.
;
; Build & flash:
;   pio run                 compile
;   pio run -t upload       flash (use the port labelled "USB", not "UART":
;                            the S3 uses native USB-OTG, not a UART bridge)
;   pio run -t monitor      serial monitor at 115200 baud
;
; See ../docs/setup_firmware.md for wiring and a board-variant caveat.

[env:hand_teleoperation]
platform      = espressif32@~6.4.0
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
board_upload.flash_size = 8MB

; Native USB-CDC serial: the S3 uses USB-OTG, not a UART bridge.
; If the monitor shows nothing, try the UART port and drop these two flags.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps = h2zero/NimBLE-Arduino @ ^1.4.2
